name: PR Auto Verify & Safety Audit

on:
  pull_request_target:
    branches:
      - main
    paths:
      - 'rules/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Rule Audit
        id: audit
        run: |
          node scripts/validate-pr.cjs
        continue-on-error: true

      - name: Comment PR Audit Report
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reportPath = path.resolve('pr-audit-report.md');
            if (fs.existsSync(reportPath)) {
              const body = fs.readFileSync(reportPath, 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

      - name: Check Exit Status
        if: steps.audit.outcome == 'failure'
        run: |
          echo "❌ 规则审计未通过，阻断合并！"
          exit 1

      - name: Auto Approve & Auto Merge
        if: steps.audit.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log(`🤖 开始为 PR #${prNumber} 执行自动化机审批准与合并...`);

            try {
              // 1. 提交官方审查 APPROVE
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: '🤖 **DeepCloud 自动化机审中心**：静态安全扫描 100% 通过，无恶意代码与内网探测指令，结构合规，予以自动批准！🚀'
              });
              console.log('✔ 已成功提交 APPROVE 审核批准！');

              // 2. 自动合并 PR (Squash 模式)
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_title: `feat(rules): 自动机审合入 PR #${prNumber}`,
                commit_message: `由 DeepCloud CI 机器人全自动审批并合并。\n自动化安全合规体检 100% 满分通过。`
              });
              console.log(`✔ 已成功自动合并 PR #${prNumber} 到 main 分支！`);

            } catch (error) {
              console.warn('自动合并遇到限制或提示:', error.message);
              // 如果仓库尚未在 Settings 勾选 "Allow GitHub Actions to create and approve pull requests"，给管理员友情提示
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: `ℹ️ **机审体检已 100% 通过！**\n> 提示：若当前仓库未开启 Actions 自动合入权限，仓库管理员 (@${owner}) 可直接点击上方绿色按钮一键手动合并。\n> 开启全自动路径：仓库 **Settings $\\rightarrow$ Actions $\\rightarrow$ General $\\rightarrow$ Workflow permissions** 中勾选 **"Allow GitHub Actions to create and approve pull requests"** 即可完全无需人工点击。`
              });
            }
